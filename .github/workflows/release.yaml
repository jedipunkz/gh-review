name: release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to increment from the latest vX.Y.Z tag
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
  push:
    tags:
      - "v*"
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      # gh release create tags and releases under this run's token.
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine tag
        id: tag
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="$GITHUB_REF_NAME"
          else
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "release must be run from main (got $GITHUB_REF)" >&2
              exit 1
            fi
            latest="$(git tag --list 'v*' --sort=-v:refname | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ && !found { print; found = 1 }')"
            tag="$(.github/scripts/next-version.sh "$latest" "$BUMP")"
            echo "latest: ${latest:-<none>}, bump: $BUMP, next: $tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            gh release create "$TAG" --verify-tag --generate-notes
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes
          fi
        shell: bash
  build:
    needs: prepare
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset-os: linux
            asset-arch: amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset-os: linux
            asset-arch: arm64
            cross: true
          # The macos-13 (x86_64) hosted runners were retired by GitHub;
          # macOS runners are Intel-less now, so build the x86_64 target by
          # cross-compiling on an arm64 macOS host (Xcode handles -arch).
          - os: macos-15
            target: x86_64-apple-darwin
            asset-os: macos
            asset-arch: amd64
          - os: macos-14
            target: aarch64-apple-darwin
            asset-os: macos
            asset-arch: arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset-os: windows
            asset-arch: amd64
    runs-on: ${{ matrix.os }}
    permissions:
      # gh release upload pushes the built asset under this run's token.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked
      - name: Build
        working-directory: ${{ github.workspace }}
        env:
          CARGO_TARGET: ${{ matrix.target }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cargo build --release --target "$CARGO_TARGET"
            cp "target/$CARGO_TARGET/release/gh-review.exe" "gh-review-${{ matrix.asset-os }}-${{ matrix.asset-arch }}.exe"
          else
            if [ "${{ matrix.cross }}" = "true" ]; then
              cross build --release --target "$CARGO_TARGET"
            else
              cargo build --release --target "$CARGO_TARGET"
            fi
            cp "target/$CARGO_TARGET/release/gh-review" "gh-review-${{ matrix.asset-os }}-${{ matrix.asset-arch }}"
          fi
        shell: bash
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            gh release upload "$TAG" "gh-review-${{ matrix.asset-os }}-${{ matrix.asset-arch }}.exe" --clobber
          else
            gh release upload "$TAG" "gh-review-${{ matrix.asset-os }}-${{ matrix.asset-arch }}" --clobber
          fi
        shell: bash
