[package]
name = "gh-review"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "gh extension: TUI to review and approve pull requests"
license = "MIT"

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "sync", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
dirs = "5"
filetime = "0.2"
unicode-width = "0.2"
# Parser only (no themes, no HTML); pure-Rust regex keeps cross builds free of C.
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "regex-fancy"] }

[dev-dependencies]
tempfile = "3"
divan = "0.1"
proptest = "1"

[[bench]]
name = "perf"
harness = false

[profile.release]
lto = true
strip = true
